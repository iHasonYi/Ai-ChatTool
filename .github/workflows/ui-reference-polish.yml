name: Apply Nova Reference UI Polish

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  polish-ui:
    if: ${{ !contains(github.event.head_commit.message, 'chore: apply Nova reference UI polish') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply visual layer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('style.css')
          css = r'''

          /* =====================================================================
             v1.6.0 — Nova Reference Workspace UI
             Visual-only layer. Existing API, chat, streaming, profiles and
             failover selectors are intentionally preserved.
             ===================================================================== */

          :root {
              --nova-ui-sidebar: 248px;
              --nova-ui-collapsed-sidebar: 72px;
              --nova-ui-content: 900px;
              --nova-ui-composer: 860px;
              --nova-ui-control: #8b7cff;
          }

          /* ---------------------------------------------------------------------
             Workspace shell
             --------------------------------------------------------------------- */

          .app-shell {
              background: var(--bg) !important;
          }

          .main-content {
              min-width: 0 !important;
              background: transparent !important;
          }

          .topbar {
              height: 60px !important;
              min-height: 60px !important;
              padding: 0 22px !important;
              background: color-mix(in srgb, var(--bg) 88%, transparent) !important;
              border-bottom: 1px solid var(--border) !important;
              backdrop-filter: blur(20px) saturate(125%) !important;
          }

          .topbar-left,
          .topbar-right {
              gap: 7px !important;
          }

          .active-model {
              min-height: 36px !important;
              padding: 0 13px !important;
              border: 1px solid var(--border) !important;
              border-radius: 999px !important;
              background: var(--surface) !important;
              box-shadow: 0 5px 18px rgba(0,0,0,.08) !important;
          }

          .active-model:hover {
              border-color: color-mix(in srgb, var(--primary) 28%, var(--border)) !important;
              background: var(--surface-secondary) !important;
          }

          .model-info strong {
              font-size: 12px !important;
          }

          .workspace-health-button {
              min-height: 34px !important;
              border-color: var(--border) !important;
              background: var(--surface) !important;
          }

          /* ---------------------------------------------------------------------
             Sidebar — expanded
             --------------------------------------------------------------------- */

          .sidebar {
              width: var(--nova-ui-sidebar) !important;
              min-width: var(--nova-ui-sidebar) !important;
              max-width: var(--nova-ui-sidebar) !important;
              flex: 0 0 var(--nova-ui-sidebar) !important;
              padding: 14px 10px !important;
              background: color-mix(in srgb, var(--surface-solid) 97%, var(--bg) 3%) !important;
              border-right: 1px solid var(--border) !important;
              border-left: 0 !important;
              box-shadow: 8px 0 32px rgba(0,0,0,.035) !important;
          }

          .sidebar-top {
              height: 42px !important;
              min-height: 42px !important;
              margin-bottom: 12px !important;
              padding: 0 8px !important;
          }

          .brand {
              gap: 9px !important;
          }

          .brand-icon {
              width: 32px !important;
              height: 32px !important;
              border-radius: 10px !important;
              background: linear-gradient(145deg, var(--primary), color-mix(in srgb, var(--primary) 45%, #fff 55%)) !important;
              box-shadow: 0 8px 24px var(--primary-glow) !important;
          }

          .brand-text strong {
              font-size: 14px !important;
          }

          .brand-text small {
              font-size: 9px !important;
              margin-top: 1px !important;
          }

          .new-chat-button {
              width: calc(100% - 20px) !important;
              min-height: 44px !important;
              margin: 0 10px 13px !important;
              border-radius: 12px !important;
              background: var(--surface-secondary) !important;
              border: 1px solid var(--border) !important;
              color: var(--text) !important;
              box-shadow: none !important;
          }

          .new-chat-button:hover {
              background: var(--surface-hover) !important;
              border-color: var(--border-strong) !important;
              transform: translateY(-1px) !important;
              box-shadow: none !important;
          }

          .new-chat-icon {
              width: 24px !important;
              height: 24px !important;
              background: var(--surface-tertiary) !important;
              color: var(--text) !important;
          }

          .sidebar-nav {
              margin: 0 0 12px !important;
              gap: 3px !important;
          }

          .sidebar-nav-item {
              min-height: 36px !important;
              padding: 0 10px !important;
              border-radius: 9px !important;
              color: var(--text-secondary) !important;
          }

          .sidebar-nav-item:hover {
              background: var(--surface-secondary) !important;
              color: var(--text) !important;
          }

          .sidebar-nav-item.active,
          .sidebar-nav-item.is-active {
              background: var(--primary-soft) !important;
              color: var(--text) !important;
          }

          .sidebar-section {
              margin-top: 5px !important;
              padding: 0 2px !important;
          }

          .section-title {
              min-height: 30px !important;
              padding: 5px 8px !important;
          }

          .section-title-label {
              color: var(--text-muted) !important;
              font-size: 10px !important;
              text-transform: uppercase;
              letter-spacing: .08em;
          }

          .chat-list {
              gap: 3px !important;
          }

          .chat-item {
              min-height: 38px !important;
              padding: 7px 9px !important;
              border-radius: 10px !important;
          }

          .chat-item:hover {
              background: var(--surface-secondary) !important;
              border-color: var(--border) !important;
          }

          .chat-item.active {
              background: var(--primary-soft) !important;
              border-color: color-mix(in srgb, var(--primary) 18%, transparent) !important;
              color: var(--text) !important;
          }

          .sidebar-bottom {
              margin-top: 10px !important;
              padding-top: 9px !important;
          }

          .sidebar-action {
              min-height: 36px !important;
              padding: 0 8px !important;
              border-radius: 9px !important;
          }

          /* ---------------------------------------------------------------------
             Sidebar — collapsed rail
             --------------------------------------------------------------------- */

          .sidebar.is-collapsed {
              width: var(--nova-ui-collapsed-sidebar) !important;
              min-width: var(--nova-ui-collapsed-sidebar) !important;
              max-width: var(--nova-ui-collapsed-sidebar) !important;
              flex: 0 0 var(--nova-ui-collapsed-sidebar) !important;
              padding: 12px 8px !important;
          }

          .sidebar.is-collapsed .sidebar-top {
              width: 100% !important;
              height: 42px !important;
              margin-bottom: 12px !important;
              padding: 0 !important;
              justify-content: center !important;
          }

          .sidebar.is-collapsed .brand {
              width: 38px !important;
              justify-content: center !important;
          }

          .sidebar.is-collapsed .brand-icon {
              width: 34px !important;
              height: 34px !important;
          }

          .sidebar.is-collapsed .brand-text,
          .sidebar.is-collapsed .new-chat-button > span:not(.new-chat-icon),
          .sidebar.is-collapsed .sidebar-nav-item > span:not(.nav-icon),
          .sidebar.is-collapsed .section-title,
          .sidebar.is-collapsed .sidebar-section,
          .sidebar.is-collapsed .chat-list,
          .sidebar.is-collapsed .sidebar-search,
          .sidebar.is-collapsed .nai-search-wrap,
          .sidebar.is-collapsed .action-content {
              display: none !important;
          }

          .sidebar.is-collapsed .sidebar-collapse-button {
              top: 57px !important;
              right: 50% !important;
              width: 28px !important;
              height: 28px !important;
              transform: translateX(50%) !important;
              border-radius: 9px !important;
              background: var(--surface-secondary) !important;
          }

          .sidebar.is-collapsed .new-chat-button {
              width: 44px !important;
              min-width: 44px !important;
              height: 44px !important;
              min-height: 44px !important;
              margin: 28px auto 11px !important;
              padding: 0 !important;
              justify-content: center !important;
              border-radius: 13px !important;
          }

          .sidebar.is-collapsed .sidebar-nav {
              width: 100% !important;
              margin: 0 !important;
              align-items: center !important;
              gap: 5px !important;
          }

          .sidebar.is-collapsed .sidebar-nav-item {
              width: 44px !important;
              min-width: 44px !important;
              height: 42px !important;
              min-height: 42px !important;
              margin: 0 !important;
              padding: 0 !important;
              justify-content: center !important;
              border-radius: 12px !important;
          }

          .sidebar.is-collapsed .nav-icon {
              width: auto !important;
              font-size: 17px !important;
          }

          .sidebar.is-collapsed .sidebar-bottom {
              margin-top: auto !important;
              padding-top: 9px !important;
              align-items: center !important;
          }

          .sidebar.is-collapsed .sidebar-action {
              width: 44px !important;
              min-width: 44px !important;
              height: 42px !important;
              min-height: 42px !important;
              margin: 0 !important;
              padding: 0 !important;
              justify-content: center !important;
              border-radius: 12px !important;
          }

          /* Control + Compare: always stacked in the collapsed rail. */
          .sidebar.is-collapsed #naiSidebarTools,
          .sidebar.is-collapsed .nai-sidebar-tools {
              display: flex !important;
              flex-direction: column !important;
              align-items: center !important;
              justify-content: flex-start !important;
              width: 100% !important;
              margin: 9px 0 !important;
              padding: 0 !important;
              gap: 6px !important;
              overflow: visible !important;
          }

          .sidebar.is-collapsed #naiSidebarTools .nai-tool-button,
          .sidebar.is-collapsed .nai-sidebar-tools .nai-tool-button {
              width: 44px !important;
              min-width: 44px !important;
              max-width: 44px !important;
              height: 42px !important;
              min-height: 42px !important;
              max-height: 42px !important;
              flex: 0 0 42px !important;
              margin: 0 !important;
              padding: 0 !important;
              justify-content: center !important;
              border-radius: 12px !important;
              overflow: hidden !important;
              white-space: nowrap !important;
          }

          /* ---------------------------------------------------------------------
             Welcome screen
             --------------------------------------------------------------------- */

          .chat-area {
              background:
                  radial-gradient(circle at 50% 4%, var(--primary-soft), transparent 28%),
                  transparent !important;
          }

          .welcome-screen {
              width: min(880px, calc(100% - 48px)) !important;
              max-width: 880px !important;
              padding: clamp(64px, 10vh, 105px) 20px 170px !important;
          }

          .welcome-icon {
              width: 58px !important;
              height: 58px !important;
              margin-bottom: 18px !important;
              border-radius: 18px !important;
              background: var(--surface-secondary) !important;
              border: 1px solid var(--border) !important;
              box-shadow: 0 12px 35px rgba(0,0,0,.12) !important;
          }

          .welcome-icon-inner {
              width: 32px !important;
              height: 32px !important;
              border-radius: 10px !important;
              background: var(--text) !important;
              color: var(--bg) !important;
          }

          .welcome-badge {
              min-height: 28px !important;
              padding: 6px 11px !important;
              border-radius: 8px !important;
              background: var(--surface) !important;
              border: 1px solid var(--border) !important;
              color: var(--text-muted) !important;
          }

          .welcome-screen h1 {
              margin: 17px 0 10px !important;
              font-size: clamp(34px, 4vw, 48px) !important;
              line-height: 1.05 !important;
              letter-spacing: -.05em !important;
              font-weight: 750 !important;
          }

          .welcome-screen p {
              max-width: 610px !important;
              margin: 0 auto !important;
              color: var(--text-muted) !important;
              font-size: 13px !important;
              line-height: 1.75 !important;
          }

          .quick-actions {
              width: min(720px, 100%) !important;
              margin: 28px auto 0 !important;
              grid-template-columns: repeat(3, minmax(0,1fr)) !important;
              gap: 9px !important;
          }

          .quick-card {
              min-height: 122px !important;
              padding: 15px !important;
              border-radius: 13px !important;
              background: var(--surface) !important;
              border: 1px solid var(--border) !important;
              box-shadow: none !important;
          }

          .quick-card:hover {
              transform: translateY(-2px) !important;
              border-color: color-mix(in srgb, var(--primary) 22%, var(--border)) !important;
              background: var(--surface-secondary) !important;
          }

          .quick-card-icon {
              width: 30px !important;
              height: 30px !important;
              margin-bottom: 12px !important;
              border-radius: 9px !important;
              background: var(--surface-secondary) !important;
              color: var(--text) !important;
          }

          .quick-card strong {
              font-size: 11px !important;
          }

          .quick-card small {
              font-size: 9px !important;
              line-height: 1.45 !important;
          }

          .quick-card-arrow {
              width: 30px !important;
              height: 30px !important;
              margin-top: auto !important;
              margin-bottom: 0 !important;
              border-radius: 9px !important;
              background: var(--surface-secondary) !important;
              color: var(--text-secondary) !important;
          }

          .welcome-features {
              margin-top: 19px !important;
              color: var(--text-muted) !important;
              opacity: .8 !important;
          }

          /* ---------------------------------------------------------------------
             Conversation layout
             --------------------------------------------------------------------- */

          .messages {
              width: min(var(--nova-ui-content), calc(100% - 56px)) !important;
              max-width: var(--nova-ui-content) !important;
              padding: 38px 0 190px !important;
          }

          .message {
              width: 100% !important;
              gap: 12px !important;
              margin-bottom: 28px !important;
          }

          .message.user {
              justify-content: flex-end !important;
              padding-left: 12% !important;
          }

          .message.user .message-body {
              max-width: min(680px, 78%) !important;
              align-items: flex-end !important;
          }

          .message.user .message-content {
              display: block !important;
              width: fit-content !important;
              max-width: 100% !important;
              padding: 12px 16px !important;
              border-radius: 17px 17px 6px 17px !important;
              background: var(--surface-secondary) !important;
              border: 1px solid var(--border) !important;
              color: var(--text) !important;
              font-size: 16px !important;
              line-height: 1.65 !important;
              box-shadow: var(--shadow-xs) !important;
          }

          .message.user .message-content p {
              margin: 0 !important;
          }

          .message.assistant {
              align-items: flex-start !important;
              padding-right: 4% !important;
              margin-top: 8px !important;
              margin-bottom: 38px !important;
          }

          .message.assistant .message-avatar {
              width: 34px !important;
              height: 34px !important;
              flex: 0 0 34px !important;
              border-radius: 11px !important;
              background: var(--primary-soft) !important;
              border: 1px solid color-mix(in srgb, var(--primary) 22%, transparent) !important;
              color: var(--primary) !important;
              box-shadow: 0 8px 22px var(--primary-glow) !important;
          }

          .message.assistant .message-body {
              max-width: min(780px, calc(100% - 46px)) !important;
          }

          .message.assistant .message-content {
              color: var(--text) !important;
              font-size: 16px !important;
              line-height: 1.82 !important;
              letter-spacing: -.006em !important;
          }

          .message.assistant .message-content p {
              margin: 0 0 15px !important;
          }

          .message.assistant .message-content strong {
              font-weight: 750 !important;
          }

          .message-meta {
              margin-top: 7px !important;
              padding: 0 2px !important;
              color: var(--text-muted) !important;
              font-size: 10px !important;
          }

          /* ---------------------------------------------------------------------
             Message action bar
             --------------------------------------------------------------------- */

          .message-actions,
          .nai-action-bar {
              display: flex !important;
              align-items: center !important;
              flex-wrap: wrap !important;
              gap: 4px !important;
              margin-top: 9px !important;
              opacity: .65 !important;
          }

          .message:hover .message-actions,
          .message:focus-within .message-actions,
          .message:hover .nai-action-bar,
          .message:focus-within .nai-action-bar {
              opacity: 1 !important;
          }

          .message-action,
          .nai-action {
              min-height: 30px !important;
              padding: 0 10px !important;
              border: 1px solid transparent !important;
              border-radius: 9px !important;
              background: transparent !important;
              color: var(--text-muted) !important;
              font-size: 10px !important;
              font-weight: 650 !important;
          }

          .message-action:hover,
          .nai-action:hover {
              color: var(--text) !important;
              background: var(--surface-secondary) !important;
              border-color: var(--border) !important;
              transform: translateY(-1px) !important;
          }

          /* ---------------------------------------------------------------------
             Code + generated images
             --------------------------------------------------------------------- */

          .code-block,
          .message-content pre {
              border-radius: 14px !important;
          }

          .message.assistant .message-content img.generated-image,
          .message.assistant .message-image {
              display: block !important;
              max-width: min(100%, 760px) !important;
              max-height: 580px !important;
              width: auto !important;
              height: auto !important;
              border-radius: 18px !important;
              border: 1px solid var(--border) !important;
              box-shadow: 0 20px 55px var(--shadow-md) !important;
              cursor: zoom-in !important;
          }

          .message.assistant .message-content img.generated-image:hover,
          .message.assistant .message-image:hover {
              transform: translateY(-2px) !important;
              box-shadow: 0 24px 65px var(--shadow-md) !important;
          }

          /* ---------------------------------------------------------------------
             Floating composer
             --------------------------------------------------------------------- */

          .composer-wrapper {
              position: fixed !important;
              left: var(--nova-ui-sidebar) !important;
              right: 0 !important;
              bottom: 0 !important;
              z-index: 100 !important;
              padding: 26px 24px 15px !important;
              background: linear-gradient(to bottom, transparent 0%, color-mix(in srgb, var(--bg) 80%, transparent) 34%, var(--bg) 76%) !important;
              pointer-events: none !important;
          }

          .sidebar.is-collapsed ~ .mobile-overlay + .main-content .composer-wrapper,
          .app-shell:has(.sidebar.is-collapsed) .composer-wrapper {
              left: var(--nova-ui-collapsed-sidebar) !important;
          }

          .composer-wrapper > *,
          .composer,
          .attachment-preview {
              pointer-events: auto !important;
          }

          .composer-container {
              width: min(var(--nova-ui-composer), calc(100% - 20px)) !important;
              max-width: var(--nova-ui-composer) !important;
              margin: 0 auto !important;
          }

          .composer {
              min-height: 82px !important;
              padding: 8px 10px 8px 13px !important;
              border: 1px solid var(--border-strong) !important;
              border-radius: 21px !important;
              background: color-mix(in srgb, var(--surface-solid) 94%, transparent) !important;
              box-shadow: 0 20px 60px rgba(0,0,0,.20), inset 0 1px 0 rgba(255,255,255,.035) !important;
              backdrop-filter: blur(24px) saturate(130%) !important;
          }

          .composer:focus-within {
              border-color: color-mix(in srgb, var(--primary) 25%, var(--border-strong)) !important;
              box-shadow: 0 22px 64px rgba(0,0,0,.22), 0 0 0 2px color-mix(in srgb, var(--primary) 5%, transparent) !important;
          }

          .composer-top {
              padding: 0 !important;
          }

          #messageInput {
              width: 100% !important;
              min-height: 50px !important;
              max-height: 220px !important;
              padding: 9px 9px 5px !important;
              border: 0 !important;
              outline: none !important;
              box-shadow: none !important;
              border-radius: 14px !important;
              background: transparent !important;
              color: var(--text) !important;
              caret-color: var(--primary) !important;
              font-size: 16px !important;
              line-height: 1.65 !important;
          }

          #messageInput:focus,
          #messageInput:focus-visible {
              border: 0 !important;
              outline: none !important;
              box-shadow: none !important;
          }

          #messageInput::placeholder {
              color: var(--text-muted) !important;
              opacity: 1 !important;
          }

          .composer-bottom {
              min-height: 38px !important;
              padding: 2px 0 0 !important;
              border: 0 !important;
          }

          .composer-tools,
          .composer-actions {
              align-items: center !important;
          }

          .tool-button {
              width: 34px !important;
              height: 34px !important;
              padding: 0 !important;
              border-radius: 10px !important;
              background: transparent !important;
              color: var(--text-secondary) !important;
          }

          .tool-button:hover {
              background: var(--surface-hover) !important;
              color: var(--text) !important;
          }

          .tool-label {
              display: none !important;
          }

          .input-hint {
              margin-right: 8px !important;
              color: var(--text-muted) !important;
              font-size: 10px !important;
          }

          .send-button {
              width: 43px !important;
              height: 43px !important;
              min-width: 43px !important;
              min-height: 43px !important;
              border: 0 !important;
              border-radius: 50% !important;
              background: var(--primary) !important;
              color: #fff !important;
              box-shadow: 0 10px 26px var(--primary-glow) !important;
          }

          .send-button:hover {
              background: var(--primary-hover) !important;
              color: #fff !important;
              transform: translateY(-2px) scale(1.025) !important;
          }

          .send-button:active {
              transform: scale(.96) !important;
          }

          #sendIcon {
              font-size: 21px !important;
              font-weight: 700 !important;
              line-height: 1 !important;
              transform: translateY(-1px) !important;
          }

          .send-button.stop {
              background: var(--danger) !important;
          }

          .composer-disclaimer {
              padding-top: 9px !important;
              color: var(--text-muted) !important;
              font-size: 9px !important;
          }

          /* ---------------------------------------------------------------------
             Themes
             --------------------------------------------------------------------- */

          html[data-theme="dark"] .composer {
              background: rgba(18,21,29,.94) !important;
              border-color: rgba(255,255,255,.12) !important;
          }

          html[data-theme="light"] .composer {
              background: rgba(255,255,255,.95) !important;
              border-color: rgba(20,25,35,.13) !important;
              box-shadow: 0 20px 55px rgba(20,25,35,.13), inset 0 1px 0 rgba(255,255,255,.95) !important;
          }

          html[data-theme="light"] .message.user .message-content {
              background: #e9ebef !important;
              border-color: rgba(20,25,35,.08) !important;
              color: var(--text) !important;
          }

          html[data-theme="light"] .message.assistant .message-content,
          html[data-theme="light"] #messageInput {
              color: var(--text) !important;
          }

          html[data-theme="light"] .send-button {
              background: #171a20 !important;
              color: #fff !important;
              box-shadow: 0 10px 25px rgba(20,25,35,.18) !important;
          }

          html[data-theme="gold-silver"] .composer,
          html.gold-silver .composer {
              background: linear-gradient(145deg, rgba(23,23,24,.97), rgba(15,15,16,.96)) !important;
              border-color: rgba(214,174,93,.28) !important;
          }

          html[data-theme="gold-silver"] .send-button,
          html.gold-silver .send-button {
              background: linear-gradient(145deg, #e7c873, #b88932) !important;
              color: #18120a !important;
              box-shadow: 0 10px 28px rgba(214,174,93,.24) !important;
          }

          html[data-theme="gold-silver"] .send-button:hover,
          html.gold-silver .send-button:hover {
              background: linear-gradient(145deg, #f0d582, #c99a3e) !important;
          }

          html[data-theme="gold-silver"] .message.user .message-content,
          html.gold-silver .message.user .message-content {
              background: linear-gradient(135deg, rgba(214,174,93,.10), rgba(201,205,211,.06)) !important;
              border-color: rgba(214,174,93,.18) !important;
          }

          html[data-theme="gold-silver"] .message.assistant .message-avatar,
          html.gold-silver .message.assistant .message-avatar {
              background: linear-gradient(145deg, rgba(214,174,93,.20), rgba(201,205,211,.10)) !important;
              color: #e5c36f !important;
              border-color: rgba(214,174,93,.30) !important;
          }

          html[data-theme="gold-silver"] .sidebar-nav-item.active,
          html[data-theme="gold-silver"] .sidebar-nav-item.is-active,
          html.gold-silver .sidebar-nav-item.active,
          html.gold-silver .sidebar-nav-item.is-active {
              background: linear-gradient(90deg, rgba(214,174,93,.15), rgba(201,205,211,.05)) !important;
          }

          /* ---------------------------------------------------------------------
             Responsive
             --------------------------------------------------------------------- */

          @media (max-width: 900px) {
              .sidebar {
                  width: 280px !important;
                  min-width: 280px !important;
                  max-width: 280px !important;
                  flex-basis: 280px !important;
              }

              .sidebar.is-collapsed {
                  width: 280px !important;
                  min-width: 280px !important;
                  max-width: 280px !important;
                  flex-basis: 280px !important;
              }

              .composer-wrapper,
              .app-shell:has(.sidebar.is-collapsed) .composer-wrapper {
                  left: 0 !important;
                  padding: 18px 12px 12px !important;
              }

              .messages {
                  width: min(94%, 760px) !important;
              }

              .message.user {
                  padding-left: 2% !important;
              }

              .message.user .message-body {
                  max-width: 84% !important;
              }
          }

          @media (max-width: 720px) {
              .topbar {
                  height: 58px !important;
                  min-height: 58px !important;
                  padding: 0 12px !important;
              }

              .workspace-health-label {
                  display: none !important;
              }

              .welcome-screen {
                  width: calc(100% - 22px) !important;
                  padding-top: 54px !important;
              }

              .welcome-screen h1 {
                  font-size: 32px !important;
              }

              .quick-actions {
                  grid-template-columns: 1fr !important;
                  width: min(480px, 100%) !important;
              }

              .quick-card {
                  min-height: 96px !important;
              }

              .messages {
                  width: calc(100% - 22px) !important;
                  padding-top: 24px !important;
                  padding-bottom: 168px !important;
              }

              .message.assistant .message-content,
              .message.user .message-content {
                  font-size: 15px !important;
              }

              .message.assistant .message-body {
                  max-width: calc(100% - 44px) !important;
              }

              .message.user .message-body {
                  max-width: 91% !important;
              }

              .composer {
                  min-height: 78px !important;
                  border-radius: 18px !important;
              }

              #messageInput {
                  font-size: 15px !important;
                  min-height: 46px !important;
              }

              .input-hint {
                  display: none !important;
              }

              .send-button {
                  width: 40px !important;
                  height: 40px !important;
                  min-width: 40px !important;
              }

              .message-actions,
              .nai-action-bar {
                  opacity: 1 !important;
              }
          }

          @media (prefers-reduced-motion: reduce) {
              .sidebar,
              .composer,
              .send-button,
              .message-action,
              .nai-action {
                  transition: none !important;
              }
          }
          '''

          marker = 'v1.6.0 — Nova Reference Workspace UI'
          current = path.read_text(encoding='utf-8')
          if marker not in current:
              path.write_text(current.rstrip() + css + '\n', encoding='utf-8')
          PY

      - name: Commit visual layer
        shell: bash
        run: |
          git config user.name "Nova UI Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css
          if git diff --cached --quiet; then
            echo "No UI changes required."
            exit 0
          fi
          git commit -m "chore: apply Nova reference UI polish"
          git push
