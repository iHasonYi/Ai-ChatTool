name: Nova AI hotfix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[nova-hotfix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply QA fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          app = Path('app.js')
          text = app.read_text(encoding='utf-8')

          theme_pattern = re.compile(r'function toggleTheme\(\) \{.*?\n\}\n\nfunction applyTheme\(theme\) \{.*?\n\}\n', re.S)
          theme_replacement = '''function toggleTheme() {\n    const current =\n        document.documentElement.dataset.theme ||\n        state.theme ||\n        "dark";\n\n    const order = [\n        "dark",\n        "light",\n        "gold-silver"\n    ];\n\n    const currentIndex =\n        order.indexOf(current);\n\n    const nextTheme =\n        order[(currentIndex + 1 + order.length) % order.length];\n\n    state.theme = nextTheme;\n\n    saveTheme(nextTheme);\n\n    if (typeof applyNovaTheme === "function") {\n        applyNovaTheme(nextTheme);\n    } else {\n        applyTheme(nextTheme);\n    }\n}\n\nfunction applyTheme(theme) {\n    const normalizedTheme =\n        ["dark", "light", "gold-silver"].includes(theme)\n            ? theme\n            : "dark";\n\n    document.documentElement.dataset.theme =\n        normalizedTheme;\n\n    document.documentElement.classList.toggle(\n        "light",\n        normalizedTheme === "light"\n    );\n\n    document.documentElement.classList.toggle(\n        "gold-silver",\n        normalizedTheme === "gold-silver"\n    );\n\n    const isDark =\n        normalizedTheme === "dark";\n\n    elements.themeIcon.textContent =\n        normalizedTheme === "gold-silver"\n            ? "◐"\n            : isDark\n                ? "☀"\n                : "☾";\n\n    elements.themeText.textContent =\n        normalizedTheme === "gold-silver"\n            ? "Gold & Silver"\n            : isDark\n                ? "الوضع النهاري"\n                : "الوضع الليلي";\n\n    const themeName =\n        document.getElementById("themeSwitcherName");\n\n    const themeSwatch =\n        document.getElementById("themeSwitcherSwatch");\n\n    if (themeName) {\n        themeName.textContent =\n            normalizedTheme === "gold-silver"\n                ? "Gold & Silver"\n                : normalizedTheme === "light"\n                    ? "Light"\n                    : "Dark";\n    }\n\n    if (themeSwatch) {\n        themeSwatch.className =\n            `theme-switcher-swatch theme-swatch-${normalizedTheme}`;\n    }\n}\n'''
          text, count = theme_pattern.subn(theme_replacement, text, count=1)
          if count != 1:
              raise SystemExit('Theme block was not found')

          load_pattern = re.compile(r'function loadTheme\(\) \{.*?\n\}\n', re.S)
          load_replacement = '''function loadTheme() {\n    const stored =\n        localStorage.getItem(\n            "nova_ai_theme_v2"\n        ) ||\n        localStorage.getItem(\n            STORAGE_KEYS.theme\n        );\n\n    if (\n        stored === "dark" ||\n        stored === "light" ||\n        stored === "gold-silver"\n    ) {\n        return stored;\n    }\n\n    return (\n        window.matchMedia &&\n        window.matchMedia(\n            "(prefers-color-scheme: dark)"\n        ).matches\n    )\n        ? "dark"\n        : "light";\n}\n'''
          text, count = load_pattern.subn(load_replacement, text, count=1)
          if count != 1:
              raise SystemExit('loadTheme block was not found')

          save_pattern = re.compile(r'function saveTheme\(theme\) \{.*?\n\}\n', re.S)
          save_replacement = '''function saveTheme(theme) {\n    const normalizedTheme =\n        ["dark", "light", "gold-silver"].includes(theme)\n            ? theme\n            : "dark";\n\n    localStorage.setItem(\n        STORAGE_KEYS.theme,\n        normalizedTheme\n    );\n\n    localStorage.setItem(\n        "nova_ai_theme_v2",\n        normalizedTheme\n    );\n}\n'''
          text, count = save_pattern.subn(save_replacement, text, count=1)
          if count != 1:
              raise SystemExit('saveTheme block was not found')

          marker = 'function logApiEvent(type, profile, status, duration, message) {'
          if marker not in text:
              raise SystemExit('logApiEvent was not found')

          if 'function readJson(key, fallback = null)' not in text:
              text = text.replace(marker, '''function readJson(key, fallback = null) {\n    try {\n        const raw = localStorage.getItem(key);\n        return raw ? JSON.parse(raw) : fallback;\n    } catch {\n        return fallback;\n    }\n}\n\n''' + marker, 1)

          # Add a non-stream JSON fallback without changing the existing SSE parser.
          stream_marker = 'async function readStreamingResponse(\n    response,\n    assistantMessage,\n    assistantElement\n) {'
          if stream_marker not in text:
              raise SystemExit('readStreamingResponse was not found')

          stream_insert = '''async function readStreamingResponse(\n    response,\n    assistantMessage,\n    assistantElement\n) {\n    const contentType =\n        response.headers.get("content-type") ||\n        "";\n\n    if (!contentType.includes("text/event-stream")) {\n        const raw = await response.text();\n        let data;\n\n        try {\n            data = JSON.parse(raw);\n        } catch {\n            const plain = raw.trim();\n            if (plain) {\n                assistantMessage.content += plain;\n                updateAssistantElement(assistantMessage, assistantElement);\n                return;\n            }\n\n            throw new Error("The API returned an empty response body.");\n        }\n\n        if (data?.error) {\n            const message =\n                data.error.message ||\n                data.error.detail ||\n                "The API returned an error.";\n            const error = new Error(String(message));\n            error.status = Number(data.error.code || data.error.status || response.status) || response.status;\n            error.retryable = shouldFailover(error.status);\n            throw error;\n        }\n\n        if (data?.usage) {\n            assistantMessage.usage = data.usage;\n        }\n\n        const content = extractStreamingDelta(data);\n        if (typeof content === "string" && content) {\n            assistantMessage.content += content;\n            updateAssistantElement(assistantMessage, assistantElement);\n            scrollChatToBottom();\n        }\n\n        if (!assistantMessage.content && !assistantMessage.usage) {\n            throw new Error("The API response did not contain assistant content.");\n        }\n\n        return;\n    }\n'''
          text = text.replace(stream_marker, stream_insert, 1)

          app.write_text(text, encoding='utf-8')

          # Keep the displayed version aligned with the repaired build.
          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = re.sub(r'Nova AI — Universal AI Workspace v[0-9.]+', 'Nova AI — Universal AI Workspace v1.6.0', html, count=1)
          index.write_text(html, encoding='utf-8')

      - name: Validate JavaScript
        run: node --check app.js

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix QA runtime and API compatibility [nova-hotfix]"
          git push
